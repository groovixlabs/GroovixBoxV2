# GroovixBox internal instruments: what each slot I1..I16 hosts, and where it sits in the mix.
#
# Copy this file to the rig's config directory as instruments.conf
# (/mnt/usb1/config/instruments.conf by default), or start the simulator with
#   ./build/groovix_sim --audio alsa --instruments config/instruments.conf
#
# Route a track to a slot in Global settings: SHIFT + R1, pad 2, then a pad on rows 6-7.
#
# What you set here are the defaults for a new project. Once a project is saved, each plugin's
# own settings are saved with it and restored when it is opened, so an old song keeps its
# sounds even after this file changes.
#
#   I<n>        = <LV2 plugin URI>   the plugin this slot hosts
#   I<n>.gain   = 0 .. 1             level (ours, not the plugin's)
#   I<n>.pan    = -1 .. 1            -1 hard left, 0 centre, 1 hard right
#   I<n>.<name> = <value>            anything else is the plugin's: one of its control ports
#                                    by symbol, or a patch parameter by the last part of its
#                                    URI. Applied in the order written; a name the plugin
#                                    doesn't have is reported when it loads, with a sample of
#                                    the names it does have.
#
# The mixer moves these live: its faders send CC 7 (level) and its third knob row CC 10
# (pan), which reach the slot the track is routed to.
#
# Hosting needs lilv at build time (sudo apt install liblilv-dev). Without it, or when a slot
# names no plugin, the slot plays the engine's stand-in tone instead.
#
# `lv2ls` lists the plugin URIs installed on this machine.

I1 = http://sfztools.github.io/sfizz
I1.sfzfile = ~/samples/drums.sfz   # sfizz's own parameter: the instrument to play
I1.volume  = -3                    # one of its control ports, in dB
I1.gain    = 0.8
I1.pan     = 0

# A second slot, panned a little to the right.
# I2      = http://calf.sourceforge.net/plugins/Monosynth
# I2.gain = 0.7
# I2.pan  = 0.3
