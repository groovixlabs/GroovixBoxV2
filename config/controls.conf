# GroovixBox rig: which MIDI CC each fader and knob sends, and which device to send out of.
#
# Copy this file to the rig's config directory as controls.conf (/mnt/usb1/config/controls.conf
# by default; --config DIR or $GXBOX_CONFIG_DIR moves it), or start the simulator with
#   ./build/groovix_sim --controls config/controls.conf
#
# Every control belongs to a track: the strip's track on the current track page, so the CC
# goes out on that track's MIDI channel and port. The two master faders follow the selected
# track. Moving a control sends its CC; the positions a surface reports when it starts are
# only recorded, so nothing is sent until you move something.
#
# Format:  name = cc [, sweep]     sweep is "full" (default) or "center"
#          name = off              sends nothing
#
# Names:
#   fader1 .. fader8, faderrow     the faders under the pads (faderrow = all eight)
#   master                         the fader below Shift
#   mixfader1 .. mixfader8, mixfaderrow, mixmaster       the mixer's faders
#   knob1.1 .. knob3.8             mixer knob <row>.<strip>
#   knobrow1 .. knobrow3           a whole knob row
#
# "center" holds CC 64 in a small detent in the middle, for pan-like controls.

# ---- Where the MIDI ports go ----
#
# "aconnect -o" lists what you can send to: the quoted name after "client" is what these
# lines match, and the indented lines under it are that device's inputs. So
#     client 40: 'MIDI4x4'
#         0 'MIDI4x4 Midi Out 1'
#         1 'MIDI4x4 Midi Out 2'
# is written "p1 = MIDI4x4:1" or "p1 = MIDI4x4:Midi Out 1". The ":1" counts the device's
# inputs from one; it is not the 0, 1, 2 on the left, which are ALSA's own numbers and move
# around as gear is plugged in.
#
# Without any of this the first MIDI interface found is wired up in order, so most rigs need
# nothing here.
#
# One interface, P1..P8 to its sockets in order: enough of its name to pick it out.
# midiout = MIDI4x4
#
# And what to listen to: a MIDI keyboard, whose notes play and record into the selected track.
# Without this line one is found by itself, so name one only when there are several.
# midiin = APC Key 25
#
# ---- which device plays which role ----
#
# A control surface is bound to a JOB, not to a model. The rig is always a grid and a panel,
# so the same APC can be the sequencer on one rig and the page panel on another - which is the
# point: a grid with no spare button for SHIFT needs a panel that has one.
#
#   surface.grid  = launchpadx | apcmini  the pads you sequence on
#   surface.panel = apcmini | apckey25    the pages, mode buttons, arrows, windows and SHIFT
#   surface.mixer = midimix               the faders, mutes and bank buttons
#
# Leave a line out, or say "auto", and the rig picks whatever is plugged in, best first - so
# a Launchpad X and an APC mini together need nothing here at all: the Launchpad takes the
# grid and the APC falls through to the panel, which is where SHIFT has to live. A device
# named here that is not plugged in leaves that role empty rather than quietly taking
# another: asking for one grid and silently getting a different one is worse than being told
# there is no grid.
#
# A role you name outright beats one that is only choosing for itself, so this is how you
# tell an APC to be the panel while something else takes the grid:
# surface.panel = apcmini
#
# One device, one role: whatever takes the grid is not also the panel.
#
# Or give a port a device port of its own, which is how a USB synth gets a port to itself.
#   p<n> = device             the device's first input
#   p<n> = device:2           its second input, counting the inputs it offers
#   p<n> = device:MIDI 1      the input whose name contains that
# Names match on part of the name and ignore case, so "digitone" finds "Elektron Digitone".
# Any port given a line here is wired to exactly that; the rest are left for aconnect.
# p1 = MIDI4x4:1
# p2 = MIDI4x4:2
# p3 = Digitone
# p4 = Hydrasynth:MIDI 1

# ---- A port that must not be told to play, or kept, time ----
#
# Playing sends MIDI Start, stopping sends Stop, and the clock runs 24 times a beat in
# between - on every port, which is what gear that follows our tempo wants. But a groovebox
# with a sequencer of its own reads Start as "play your own pattern", so a Korg Volca used
# here as a sound module starts its own sequence over ours the moment you press Play.
#
#   p<n>.transport = off      no Start and no Stop on that port
#   p<n>.clock     = off      and no clock either
#
# They are two switches, not one, because they answer different questions. Turning the
# transport off alone is the usual case: the device still follows our tempo, so its delay and
# LFO sync stay in time while its sequencer stays put. Turn the clock off as well for gear
# that keeps its own time and has nothing to sync - or that drifts, chatters or wakes up when
# it is clocked - and the port carries nothing but its notes.
#
# A port with no line gets both, which is how every port behaved before these existed.
# p3.transport = off      # Volca FM2: a sound module, not a sequencer
# p4.transport = off      # Volca Sample 2
# p4.clock     = off      # ... and it has no use for the tempo either

# ---- A port that goes to a socket server instead of to a cable ----
#
# "p<n>.socket = address:port" sends that MIDI port to a UDP server rather than to MIDI
# hardware. P8 is the one the settings page offers, but any port takes the line.
#
# What goes out is exactly the bytes a DIN cable would carry, one datagram per message:
#   90 24 64   note on, channel 1, C2, velocity 100
#   B2 07 7F   CC 7 = 127 on channel 3
#   C0 05      program change 5 on channel 1
#   F8         MIDI clock
# No running status and no framing of our own, so anything that reads MIDI can read this.
#
# UDP, and never blocking: a server that is not listening costs nothing and the beat goes on.
# Nothing is retried, so the occasional datagram can be lost - which for a clock that repeats
# 24 times a beat is the right trade against a send that could stall playback.
#
# The address is a dotted IPv4 address, not a name: a DNS lookup is exactly the kind of wait
# this avoids. Give the port a socket and it stops using its MIDI hardware; take the line away
# and it goes back to the cable. A line that will not open leaves the port on MIDI and says so.
# p8.socket = 192.168.1.50:5000

# The mixer: level on the faders, a filter and pan on the knobs.
mixfaderrow = 7           # Volume
knobrow1    = 74          # Filter cutoff
knobrow2    = 71          # Resonance
knobrow3    = 10, center  # Pan

# The faders under the pads.
faderrow = 11             # Expression

# The masters send nothing until you give them a CC.
master    = off
mixmaster = off

# Anything can be overridden per control, for example:
# knob3.1 = 91            # strip 1's pan knob sends reverb send instead
# fader1  = off           # fader 1 sets the tempo in Global settings anyway
