# GroovixBox rig: which MIDI CC each fader and knob sends, and which device to send out of.
#
# Copy this file to the rig's config directory as controls.conf (/mnt/usb1/config/controls.conf
# by default; --config DIR or $GXBOX_CONFIG_DIR moves it), or start the simulator with
#   ./build/groovix_sim --controls config/controls.conf
#
# Every control belongs to a track: the strip's track on the current track page, so the CC
# goes out on that track's MIDI channel and port. The two master faders follow the selected
# track. Moving a control sends its CC; the positions a surface reports when it starts are
# only recorded, so nothing is sent until you move something.
#
# Format:  name = cc [, sweep]     sweep is "full" (default) or "center"
#          name = off              sends nothing
#
# Names:
#   fader1 .. fader8, faderrow     the faders under the pads (faderrow = all eight)
#   master                         the fader below Shift
#   mixfader1 .. mixfader8, mixfaderrow, mixmaster       the mixer's faders
#   knob1.1 .. knob3.8             mixer knob <row>.<strip>
#   knobrow1 .. knobrow3           a whole knob row
#
# "center" holds CC 64 in a small detent in the middle, for pan-like controls.

# ---- Where the MIDI ports go ----
#
# "aconnect -o" lists what you can send to: the quoted name after "client" is what these
# lines match, and the indented lines under it are that device's inputs. So
#     client 40: 'MIDI4x4'
#         0 'MIDI4x4 Midi Out 1'
#         1 'MIDI4x4 Midi Out 2'
# is written "p1 = MIDI4x4:1" or "p1 = MIDI4x4:Midi Out 1". The ":1" counts the device's
# inputs from one; it is not the 0, 1, 2 on the left, which are ALSA's own numbers and move
# around as gear is plugged in.
#
# Without any of this the first MIDI interface found is wired up in order, so most rigs need
# nothing here.
#
# One interface, P1..P8 to its sockets in order: enough of its name to pick it out.
# midiout = MIDI4x4
#
# And what to listen to: a MIDI keyboard, whose notes play and record into the selected track.
# Without this line one is found by itself, so name one only when there are several.
# midiin = APC Key 25
#
# Or give a port a device port of its own, which is how a USB synth gets a port to itself.
#   p<n> = device             the device's first input
#   p<n> = device:2           its second input, counting the inputs it offers
#   p<n> = device:MIDI 1      the input whose name contains that
# Names match on part of the name and ignore case, so "digitone" finds "Elektron Digitone".
# Any port given a line here is wired to exactly that; the rest are left for aconnect.
# p1 = MIDI4x4:1
# p2 = MIDI4x4:2
# p3 = Digitone
# p4 = Hydrasynth:MIDI 1

# The mixer: level on the faders, a filter and pan on the knobs.
mixfaderrow = 7           # Volume
knobrow1    = 74          # Filter cutoff
knobrow2    = 71          # Resonance
knobrow3    = 10, center  # Pan

# The faders under the pads.
faderrow = 11             # Expression

# The masters send nothing until you give them a CC.
master    = off
mixmaster = off

# Anything can be overridden per control, for example:
# knob3.1 = 91            # strip 1's pan knob sends reverb send instead
# fader1  = off           # fader 1 sets the tempo in Global settings anyway
