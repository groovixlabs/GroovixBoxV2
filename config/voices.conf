# GroovixBox voice lists: which voices each device has, so a preset pad picks a named sound
# rather than a bank and program number.
#
# Copy this file to the rig's config directory as voices.conf (/mnt/usb1/config/voices.conf by
# default), with the CSVs it names beside it in voices/.
#
# Two lines per device, both values, so a device name can hold spaces and punctuation without
# having to survive being a filename or a config key. The id on the left is yours: any letters,
# digits, - or _, used only to pair the two lines.
#
#   <id>.device   part of the device's name, matched the way midiout and p1-p8 match it:
#                 case doesn't matter, and part of the name is enough
#   <id>.file     a CSV under the config directory
#
# sx920.device = PSR-SX920
# sx920.file   = voices/psr-sx-920.csv
#
# The CSV is the maker's own list, pasted in whole - Yamaha, Roland and the rest publish one in
# their Data List PDF. It needs a header row naming its columns, and that is all it needs: the
# reader finds MSB, LSB, PC and Name by name, in any order, among any other columns.
#
#   MSB#,LSB#,PC#,Name,,,,Type
#   104,21,1,CFX ConcertGrand,,,,S.Art
#   104,10,1,CFX StageGrand,,,,S.Art
#
# Programs count from 1, the way every printed list prints them. A row whose MSB, LSB and PC
# are not all numbers is not a voice and is skipped, which is how a heading or the copyright
# line at the foot of a list looks after itself.
#
# Preset slot n is the nth voice of the file, in the maker's order, so preset 1.01 is its first.
# A device with no list here plays the built-in General MIDI one: bank 0, 128 programs.
#
# A list that cannot be read is refused whole rather than in part - a dropped row would shift
# every slot after it and quietly change what saved projects play. The startup report says what
# each port ended up with.
